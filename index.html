<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Liftlog">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Liftlog</title>
<style>
:root{--brand:#007aff;--warm:#ff6b29;--bg:#fff;--card:#f2f2f7;--field:#fff;--sep:#d8d8dc;--text:#000;--sec:#8a8a8e;--green:#34c759;--blue:#007aff;--purple:#af52de;--yellow:#ff9500;--red:#ff3b30;--muscle:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--text)}
body{display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}
.side{max-width:300px;color:#3a3a3c;font-size:14px;line-height:1.5}
.side h1{color:#000;font-size:22px;margin:0 0 8px}
.side code{background:#ddd;padding:1px 5px;border-radius:5px}
.phone{position:relative;width:393px;height:852px;border-radius:56px;background:var(--bg);box-shadow:0 0 0 11px #1f1f22,0 0 0 13px #3a3a3e,0 30px 80px rgba(0,0,0,.35);overflow:hidden;flex-shrink:0}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:54px;color:#000;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 46px;font-weight:600;font-size:16px;z-index:55;pointer-events:none}
@media all{body{padding:0;display:block}.side{display:none}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.island,.status{display:none}.screen{padding-top:max(10px,env(safe-area-inset-top))}.tabbar{height:calc(58px + env(safe-area-inset-bottom))}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:50px}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 16px;position:relative}
.nav .title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.navbtn{color:var(--brand);background:none;border:0;font-size:17px;padding:8px 0;cursor:pointer;font-family:inherit}
.navbtn.bold{font-weight:600}
.big{font-size:34px;font-weight:700;padding:2px 16px 8px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 110px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px}
.sec{color:var(--sec)}
.cap{font-size:12px}.sub{font-size:15px}.hd{font-size:17px;font-weight:600}
.t3{font-size:20px;font-weight:700;margin:0 0 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;color:#fff;background:var(--brand)}
.btn.tonal{background:rgba(0,122,255,.12);color:var(--brand)}
.btn.small{padding:9px;font-size:15px;border-radius:10px}
.btn.red{background:rgba(255,59,48,.12);color:var(--red)}
.btn.green{background:var(--green);width:auto;padding:7px 14px;font-size:15px;border-radius:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles{display:flex;gap:8px}
.tile{flex:1;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);border-radius:12px;padding:10px;min-width:0}
.tile .v{font-weight:600;font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.list{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:22px}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:.5px solid var(--sep);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#c4c4c7;font-size:20px}
.sechead{color:var(--sec);font-size:13px;text-transform:uppercase;margin:6px 14px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid transparent;background:var(--card);color:var(--brand);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.search{width:100%;background:var(--card);border:0;border-radius:10px;padding:9px 12px;color:var(--brand);font-size:16px;margin-bottom:10px;font-family:inherit;outline:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(249,249,251,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);display:flex;padding-top:7px;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--sec);cursor:pointer;background:none;border:0;font-family:inherit}
.tab.on{color:var(--brand)}
.tab svg{width:26px;height:26px}
.seg{display:flex;background:#e3e3e8;border-radius:9px;padding:2px;margin:10px 0}
.seg button{flex:1;border:0;background:none;color:#000;padding:6px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
select{background:#fff;color:var(--brand);border:0;border-radius:8px;padding:6px 8px;font-size:14px;font-family:inherit}
.sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;animation:fade .2s}
.sheet .panel{background:#fff;width:100%;height:calc(100% - 58px);border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .panel .screen{position:relative;padding-top:6px;height:100%}
.cover{position:absolute;inset:0;z-index:30;background:#fff;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
.setgrid{display:grid;align-items:center;gap:8px;padding:3px 0;border-radius:8px}
.setgrid.done{background:rgba(52,199,89,.15)}
.setgrid .h{font-size:11px;font-weight:700;color:var(--sec);text-align:center}
.num{width:100%;background:var(--field);border:0;border-radius:8px;padding:8px 2px;text-align:center;color:var(--brand);font-weight:600;font-size:16px;font-family:inherit;font-variant-numeric:tabular-nums;outline:none}
.num::placeholder{color:#b5b5ba;font-weight:400}
.check{width:30px;height:30px;border-radius:7px;border:2px solid #c4c4c7;background:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:auto}
.check.on{background:var(--green);border-color:var(--green)}
textarea.note{width:100%;background:var(--field);border:0;border-radius:10px;padding:10px;color:var(--brand);font-size:14px;font-family:inherit;resize:none;outline:none;margin:10px 0}
.form .list .item{cursor:default}
.form input[type=text]{flex:1;background:none;border:0;color:var(--brand);font-size:16px;font-family:inherit;outline:none;padding:4px 0}
.toggle{width:51px;height:31px;border-radius:16px;background:#e3e3e8;position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--green)}.toggle.on:after{left:22px}
.video{height:210px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.video .big-ico{font-size:72px;animation:pulse 1.6s ease-in-out infinite}
.pb{background:#fff;border-radius:14px;padding:12px}
.pb .l{color:var(--warm);font-size:12px;font-weight:600}
.pb .v{font-size:20px;font-weight:700;margin:5px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center;margin:8px 0}
.cal div{height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:50%}
.cal .w{color:var(--sec);font-weight:700;font-size:11px}
.cal .on{background:var(--warm);color:#fff;font-weight:700}
.cal .today{box-shadow:inset 0 0 0 1.5px var(--warm)}
.pill{display:inline-flex;gap:5px;align-items:center;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pr{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px}
.pr .r{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:15px}
.banner{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#2b8cff,#0062d6);margin-bottom:16px;cursor:pointer}
.rcard{background:var(--card);border-radius:18px;padding:14px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.rcard .icons{display:flex}
.rcard .icons .ico{width:32px;height:32px;font-size:16px;border-radius:9px;margin-right:-6px;border:2px solid var(--card);background-clip:padding-box}
.anat{width:100%;display:block}
.anat .mi{fill:#c3c7ce}.anat .mp{fill:var(--muscle)}.anat .ms{fill:rgba(255,59,48,.38)}
.anat.anim .mp{animation:mp 2.2s ease-in-out infinite}@keyframes mp{50%{opacity:.62}}
.anat.anim .scan{animation:scan 2.6s linear infinite}@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(430px)}}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--sec);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.mchips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px}
.mchip{border:0;border-radius:20px;padding:7px 4px;font-size:12px;font-weight:500;background:#fff;color:var(--brand);cursor:pointer;font-family:inherit}
.mchip.p{background:var(--muscle);color:#fff}.mchip.s{background:rgba(255,59,48,.2);color:#c4271e}
.restrow{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;color:var(--brand);font-size:12px;font-weight:600;white-space:nowrap}
.restrow span{flex:1;height:1px;background:rgba(0,122,255,.25)}
.restrow.off{opacity:.55}
.restbar{position:absolute;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:up .25s}
.restbar .t{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;font-family:ui-rounded,-apple-system,system-ui}
.restbar .bar{height:5px;background:#e3e3e8;border-radius:3px;margin-top:10px;overflow:hidden}.restbar .bar div{height:100%;background:var(--brand);border-radius:3px}
.pillbtn{border:0;border-radius:16px;padding:8px 11px;font-size:14px;font-weight:600;background:rgba(0,122,255,.12);color:var(--brand);cursor:pointer;font-family:inherit}
.pillbtn.solid{background:var(--brand);color:#fff}
.sheet .panel.small{height:auto;max-height:62%}
.wheel{height:200px;overflow-y:auto;scroll-snap-type:y mandatory;margin:6px 16px;border-radius:12px;background:var(--card);scrollbar-width:none}
.wheel::-webkit-scrollbar{display:none}
.wheel div{scroll-snap-align:center;text-align:center;padding:9px;font-size:18px;cursor:pointer;color:#8a8a8e}
.wheel div.on{color:#000;font-weight:600;background:#fff;border-radius:10px;margin:0 8px}
.drag-row{transition:transform .15s;background:var(--card)}
.drag-row.dragging{transition:none;position:relative;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.18);background:#fff}
.handle{cursor:grab;touch-action:none;color:#b0b0b5;font-size:22px;padding:4px 6px;user-select:none}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:90;animation:fade .2s}
.dialog{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:80;display:flex;align-items:flex-end;padding:8px;animation:fade .15s}
.dialog .box{width:100%}
.dialog .grp{background:rgba(250,250,252,.97);border-radius:14px;overflow:hidden;margin-bottom:8px;text-align:center}
.dialog .grp div{padding:16px;border-bottom:.5px solid var(--sep);font-size:18px;cursor:pointer;color:var(--blue)}
.dialog .grp .msg{font-size:13px;color:var(--sec);cursor:default;padding:14px}
.dialog .grp div:last-child{border-bottom:0}
.dialog .destr{color:var(--red)!important}
.dialog .cancel{font-weight:600}
</style>
</head>

": "Medizinball-Slam"}, "cues": {"Feet planted, shoulder blades pinched, lower to mid-chest and press up.": "Füsse fest am Boden, Schulterblätter zusammen, zur Brustmitte senken und hochdrücken.", "Bench at 30–45°, bar to upper chest, press over the shoulders.": "Bank auf 30–45°, Stange zur oberen Brust, über die Schultern hochdrücken.", "Secure legs, lower bar to lower chest, press up in a slight arc.": "Beine fixieren, Stange zur unteren Brust senken, im leichten Bogen hochdrücken.", "Lower dumbbells to chest level with elbows ~45°, press and squeeze.": "Hanteln mit Ellbogen bei ca. 45° auf Brusthöhe senken, drücken und anspannen.", "Bench at 30°, press dumbbells up and slightly together.": "Bank auf 30°, Hanteln nach oben und leicht zusammen drücken.", "Soft elbows, open wide until a chest stretch, hug back up.": "Ellbogen leicht gebeugt, weit öffnen bis zur Brustdehnung, dann zusammenführen.", "Step forward, sweep handles together in a hugging arc.": "Schritt nach vorne, Griffe im Bogen vor dem Körper zusammenführen.", "Handles at mid-chest, press forward without locking out hard.": "Griffe auf Brusthöhe, nach vorne drücken ohne hart durchzustrecken.", "Elbows slightly bent, bring pads together and control the return.": "Ellbogen leicht gebeugt, Polster zusammenführen, kontrolliert zurück.", "Rigid plank, chest to just above the floor, push back up.": "Stabile Plank, Brust knapp über den Boden, wieder hochdrücken.", "Lower until shoulders are below elbows, press to lockout.": "Absenken, bis die Schultern unter den Ellbogen sind, dann ganz hochdrücken.", "Brace glutes and core, press bar overhead, head through at the top.": "Gesäss und Rumpf anspannen, Stange über Kopf drücken, Kopf durch.", "Back supported, press from ear level to overhead.": "Rücken angelehnt, von Ohrhöhe über Kopf drücken.", "Start palms facing you, rotate out as you press overhead.": "Handflächen zu dir, beim Drücken nach aussen drehen.", "Slight lean, raise to shoulder height leading with elbows.": "Leicht nach vorne geneigt, mit den Ellbogen voran auf Schulterhöhe heben.", "Cable across the body, raise out to shoulder height.": "Kabel vor dem Körper, Arm seitlich auf Schulterhöhe heben.", "Raise to eye level with straight arms, lower slowly.": "Gestreckte Arme auf Augenhöhe heben, langsam senken.", "Hinge forward, open arms wide squeezing the rear delts.": "Nach vorne beugen, Arme weit öffnen, hintere Schulter anspannen.", "Rope to forehead, elbows high, pull the rope apart.": "Seil zur Stirn ziehen, Ellbogen hoch, Seil auseinanderziehen.", "Pull bar to lower chest with elbows leading upward.": "Stange zur unteren Brust ziehen, Ellbogen führen nach oben.", "Handles at shoulder height, press overhead with control.": "Griffe auf Schulterhöhe, kontrolliert über Kopf drücken.", "Hips high, lower head toward the floor, press back up.": "Hüfte hoch, Kopf Richtung Boden senken, wieder hochdrücken.", "Kick up to a wall, stack hips over shoulders, push tall.": "An die Wand schwingen, Hüfte über Schultern, lang machen.", "Bar over mid-foot, flat back, push the floor away and stand tall.": "Stange über Fussmitte, Rücken gerade, Boden wegdrücken und aufrichten.", "Hinge to ~45°, row the bar to your lower ribs.": "Auf ca. 45° beugen, Stange zu den unteren Rippen ziehen.", "Torso parallel, explode bar from the floor to the chest each rep.": "Oberkörper waagrecht, Stange jede Wiederholung explosiv vom Boden zur Brust.", "One hand on bench, row the dumbbell to your hip.": "Eine Hand auf der Bank, Hantel zur Hüfte rudern.", "Chest up, pull bar to upper chest driving elbows down.": "Brust raus, Stange zur oberen Brust, Ellbogen nach unten ziehen.", "Sit tall, row handle to the stomach, squeeze shoulder blades.": "Aufrecht sitzen, Griff zum Bauch, Schulterblätter zusammen.", "Hinge over, row the handle to your chest keeping the back flat.": "Vorgebeugt mit geradem Rücken, Griff zur Brust ziehen.", "Chest on incline bench, row both dumbbells to the hips.": "Brust auf der Schrägbank, beide Hanteln zur Hüfte rudern.", "Belt or dumbbell between feet, pull chin over the bar.": "Gewicht am Gürtel, Kinn über die Stange ziehen.", "Bar on pins at knee height, lock out hips and shoulders.": "Stange auf Kniehöhe in der Ablage, Hüfte und Schultern durchstrecken.", "Arms straight, sweep the bar down to the thighs.": "Arme gestreckt, Stange im Bogen zu den Oberschenkeln ziehen.", "Lift shoulders straight up to the ears, pause, lower.": "Schultern gerade zu den Ohren heben, halten, senken.", "Overhand grip, pull chin over the bar, lower fully.": "Obergriff, Kinn über die Stange ziehen, ganz absenken.", "Underhand grip, pull chest toward the bar.": "Untergriff, Brust zur Stange ziehen.", "Body straight under a bar, pull chest to the bar.": "Körper gestreckt unter der Stange, Brust zur Stange ziehen.", "Hinge at the hips on the bench, rise to a straight line.": "In der Hüfte beugen, bis zur geraden Linie aufrichten.", "Explosive pull, transition over the bar, press to lockout.": "Explosiv ziehen, über die Stange wechseln, durchdrücken.", "Hang from a bar with relaxed shoulders and a firm grip.": "Mit lockeren Schultern und festem Griff an der Stange hängen.", "Elbows pinned, curl the bar up, lower slowly.": "Ellbogen fixiert, Stange hochcurlen, langsam senken.", "Supinate as you curl, no swinging.": "Beim Curlen supinieren, nicht schwingen.", "Neutral grip, curl with elbows at your sides.": "Neutraler Griff, mit Ellbogen am Körper curlen.", "Arms on the pad, curl up, lower to almost straight.": "Arme auf dem Polster, hochcurlen, fast gestreckt absenken.", "Lie back on incline, arms hang, curl without moving elbows.": "Auf der Schrägbank, Arme hängen, curlen ohne die Ellbogen zu bewegen.", "Constant tension, curl to the shoulders and squeeze.": "Konstante Spannung, zu den Schultern curlen und anspannen.", "Elbow on inner thigh, curl slowly and squeeze.": "Ellbogen am inneren Oberschenkel, langsam curlen und anspannen.", "Hands shoulder-width, elbows tucked, press up.": "Hände schulterbreit, Ellbogen eng, hochdrücken.", "Elbows fixed at your sides, push down to lockout.": "Ellbogen seitlich fixiert, ganz nach unten durchdrücken.", "Lower behind the head, extend elbows fully overhead.": "Hinter den Kopf senken, Ellbogen über Kopf ganz strecken.", "Lower bar to forehead bending only at the elbows.": "Stange nur durch Beugen der Ellbogen zur Stirn senken.", "Forearms on bench, curl the wrist up through full range.": "Unterarme auf der Bank, Handgelenk über den vollen Bewegungsumfang curlen.", "Heavy weights at your sides, walk tall with short steps.": "Schwere Gewichte seitlich, aufrecht mit kurzen Schritten gehen.", "Bar on upper back, sit down between the hips, drive up.": "Stange auf dem oberen Rücken, zwischen die Hüften setzen, hochdrücken.", "Elbows high, torso upright, squat deep and stand.": "Ellbogen hoch, Oberkörper aufrecht, tief beugen und aufstehen.", "Hold weight at chest, squat between the knees.": "Gewicht vor der Brust, zwischen die Knie absenken.", "Back on pad, lower deep, press through the whole foot.": "Rücken am Polster, tief absenken, über den ganzen Fuss drücken.", "Feet shoulder-width, lower until ~90°, press without locking.": "Füsse schulterbreit, bis ca. 90° senken, drücken ohne durchzustrecken.", "Extend knees fully, squeeze quads, lower slowly.": "Knie ganz strecken, Quadrizeps anspannen, langsam senken.", "Rear foot on bench, drop the back knee straight down.": "Hinterer Fuss auf der Bank, hinteres Knie gerade nach unten.", "Long step, back knee near the floor, step through.": "Langer Schritt, hinteres Knie nahe am Boden, durchschreiten.", "Drive through the top foot onto the box, control down.": "Über den oberen Fuss auf die Box drücken, kontrolliert hinunter.", "Soft knees, push hips back, bar slides down the thighs.": "Knie locker, Hüfte nach hinten, Stange gleitet an den Oberschenkeln hinab.", "Curl the heels toward the glutes, lower slowly.": "Fersen zum Gesäss curlen, langsam senken.", "Pad above ankles, curl down and squeeze.": "Polster über den Knöcheln, nach unten curlen und anspannen.", "Bar on back, hinge forward with a flat back, stand up.": "Stange auf dem Rücken, mit geradem Rücken nach vorne beugen, aufrichten.", "Anchor ankles, lower the torso slowly, push back up.": "Knöchel fixiert, Oberkörper langsam senken, zurückdrücken.", "Wide stance, hands inside knees, push knees out and stand.": "Breiter Stand, Hände innerhalb der Knie, Knie raus und aufrichten.", "Stand in the bar, sit hips down, drive up tall.": "In der Stange stehen, Hüfte senken, kraftvoll aufrichten.", "Upper back on bench, drive hips up, squeeze at the top.": "Oberer Rücken auf der Bank, Hüfte hochdrücken, oben anspannen.", "Push the pads outward, pause, control back.": "Polster nach aussen drücken, halten, kontrolliert zurück.", "Ankle strap on, kick the leg back squeezing the glute.": "Fussschlaufe an, Bein nach hinten kicken, Gesäss anspannen.", "Feet flat, drive hips up, squeeze and lower.": "Füsse flach, Hüfte hochdrücken, anspannen und senken.", "Full stretch at the bottom, rise high on the toes.": "Unten ganz dehnen, hoch auf die Zehen steigen.", "Pad on knees, raise heels as high as possible.": "Polster auf den Knien, Fersen so hoch wie möglich heben.", "Chest up, sit back and down, stand fully.": "Brust raus, nach hinten unten setzen, ganz aufstehen.", "One leg forward, squat down on the other and stand.": "Ein Bein vorne, auf dem anderen tief beugen und aufstehen.", "Back on the wall, thighs parallel to the floor, hold.": "Rücken an der Wand, Oberschenkel waagrecht, halten.", "Pull from the floor, extend hips, catch on the shoulders.": "Vom Boden ziehen, Hüfte strecken, Stange auf den Schultern fangen.", "Clean to the shoulders, dip and drive the bar overhead.": "Stange auf die Schultern umsetzen, Knie beugen und über Kopf stossen.", "Wide grip, one explosive pull from floor to overhead.": "Breiter Griff, ein explosiver Zug vom Boden über Kopf.", "Hinge and snap the hips, bell floats to chest height.": "Hüfte beugen und explosiv strecken, Kugel schwebt auf Brusthöhe.", "Front squat straight into an overhead press.": "Frontkniebeuge direkt in ein Drücken über Kopf.", "Bell overhead, rise from lying to standing step by step.": "Kugel über Kopf, Schritt für Schritt vom Liegen zum Stehen.", "Squat, kick back to plank, chest down, jump up.": "Hocke, Beine in den Stütz, Brust runter, hochspringen.", "High plank, drive knees to chest quickly.": "Hoher Stütz, Knie schnell zur Brust ziehen.", "Forearms down, straight line head to heels, brace.": "Unterarme am Boden, gerade Linie von Kopf bis Ferse, anspannen.", "Stack feet, lift hips into a straight line.": "Füsse übereinander, Hüfte zur geraden Linie heben.", "Top leg on bench, lift hips, hold the line.": "Oberes Bein auf der Bank, Hüfte heben, Linie halten.", "Lower back glued down, arms and legs extended low.": "Unterer Rücken am Boden, Arme und Beine gestreckt und tief.", "Hands on parallettes, lift straight legs to horizontal.": "Hände auf Parallettes, gestreckte Beine waagrecht heben.", "Curl the ribs toward the pelvis, lower slowly.": "Rippen zum Becken einrollen, langsam senken.", "Roll up to sitting, lower with control.": "Zum Sitzen aufrollen, kontrolliert absenken.", "Elbow to opposite knee, alternate with control.": "Ellbogen zum gegenüberliegenden Knie, kontrolliert wechseln.", "Lean back, rotate side to side touching the floor.": "Nach hinten lehnen, seitlich drehen und den Boden berühren.", "Hang, lift straight legs to hip height without swinging.": "Hängend gestreckte Beine auf Hüfthöhe heben, ohne zu schwingen.", "Roll out with a braced core, pull back with abs.": "Mit festem Rumpf ausrollen, mit dem Bauch zurückziehen.", "Back flat, extend opposite arm and leg, return.": "Rücken flach, gegenüberliegenden Arm und Bein strecken, zurück.", "On all fours, reach opposite arm and leg long.": "Im Vierfüsslerstand gegenüberliegenden Arm und Bein lang machen.", "Kneel, crunch the rope down toward the knees.": "Kniend das Seil Richtung Knie ziehen.", "Press the handle out and resist rotation.": "Griff nach vorne drücken und der Rotation widerstehen.", "On all fours, alternate arching and rounding the spine.": "Im Vierfüsslerstand Wirbelsäule abwechselnd rund machen und strecken.", "Lunge, elbow to instep, rotate and reach to the sky.": "Ausfallschritt, Ellbogen zum Fuss, aufdrehen und zur Decke greifen.", "Seated 90/90, rotate knees side to side with a tall spine.": "Im 90/90-Sitz die Knie mit aufrechtem Rücken hin und her drehen.", "Slow, controlled full circles of the hip joint.": "Langsame, kontrollierte Kreise im Hüftgelenk.", "Slow, biggest-possible circles with a straight arm.": "Langsame, möglichst grosse Kreise mit gestrecktem Arm.", "Side-lying, open the top arm and rotate the upper back.": "In Seitenlage den oberen Arm öffnen und den oberen Rücken drehen.", "Sit into the bottom of a squat, chest up, relax.": "Tief in die Hocke setzen, Brust hoch, entspannen.", "Half-kneel, drive the knee over the toes and back.": "Halbknien, Knie über die Zehen nach vorne und zurück schieben.", "Arms straight, pull the band apart to the chest.": "Arme gestreckt, Band bis zur Brust auseinanderziehen.", "Wide grip, pass the band overhead and behind.": "Breiter Griff, Band über den Kopf nach hinten führen.", "Wide stance, shift into one deep side squat.": "Breiter Stand, tief in eine Seite verlagern.", "Light weight, roll down vertebra by vertebra, roll up.": "Leichtes Gewicht, Wirbel für Wirbel abrollen und wieder aufrollen.", "Back to the wall, slide arms up keeping contact.": "Rücken an der Wand, Arme mit Kontakt nach oben schieben.", "Balance on one leg, rotate the pelvis open and closed.": "Auf einem Bein balancieren, Becken öffnen und schliessen.", "Deep lunge, hand inside the foot, sink the hips.": "Tiefer Ausfallschritt, Hand innen neben dem Fuss, Hüfte senken.", "Walk hands out to plank and back to the feet.": "Mit den Händen // Liftlog exercise demo renderer: side-view figure + highlighted muscles (SVG string output).
const MOT_L = {T:50,U:28,F:26,TH:38,SH:37,FOOT:13};
function mDir(a){ const r=a*Math.PI/180; return [Math.sin(r),Math.cos(r)]; }
function mAdd(p,v,k=1){ return [p[0]+v[0]*k,p[1]+v[1]*k]; }
function mLerpAng(a,b,e){ const d=((b-a)%360+540)%360-180; return a+d*e; }
function mSample(p,tsec){
  const fr=p.frames; if(fr.length===1) return fr[0];
  const seq = p.mode==='cyc' ? fr.map((_,i)=>[i,(i+1)%fr.length])
    : [...fr.slice(0,-1).map((_,i)=>[i,i+1]), ...fr.slice(0,-1).map((_,i)=>[fr.length-1-i,fr.length-2-i])];
  const hold = p.mode==='cyc'?0:p.hold, seg=p.sec+hold, t=tsec%(seg*seq.length), k=Math.floor(t/seg);
  const u=Math.max(0,Math.min(1,(t-k*seg-hold)/p.sec)), e=p.mode==='cyc'?u:(1-Math.cos(Math.PI*u))/2;
  const A=fr[seq[k][0]], B=fr[seq[k][1]], o={};
  for(const key in A) o[key] = (key==='hx'||key==='hy'||key==='sr') ? A[key]+(B[key]-A[key])*e : mLerpAng(A[key],B[key],e);
  return o;
}
function mJoints(f){
  const hip=[f.hx,f.hy], sho=mAdd(hip,mDir(f.t),MOT_L.T+(f.sr||0));
  const limb=(base,a1,a2,l1,l2)=>{ const j=mAdd(base,mDir(a1),l1); return [j,mAdd(j,mDir(a2),l2)]; };
  const [elbow,hand]=limb(sho,f.ua,f.la,MOT_L.U,MOT_L.F), [elbow2,hand2]=limb(sho,f.ua2,f.la2,MOT_L.U,MOT_L.F);
  const [knee,ankle]=limb(hip,f.th,f.sh,MOT_L.TH,MOT_L.SH), [knee2,ankle2]=limb(hip,f.th2,f.sh2,MOT_L.TH,MOT_L.SH);
  return {hip,sho,elbow,hand,elbow2,hand2,knee,ankle,knee2,ankle2,toe:mAdd(ankle,mDir(f.ft),MOT_L.FOOT),toe2:mAdd(ankle2,mDir(f.ft2),MOT_L.FOOT),

}
function renderMotion(pattern, primary, secondary, tsec){
  const f=mSample(pattern,tsec), J=mJoints(f), P=new Set(primary), S=new Set(secondary);

  const line=(a,b,w,c)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const belly=(A,B,w,front,side,pos,m,far,len=.36,thick=.34)=>{ const c=col(m,far); if(!c) return '';
    const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1, d=[dx/L,dy/L], n=front;
    const cx=A[0]+d[0]*L*pos+n[0]*side*w*.22, cy=A[1]+d[1]*L*pos+n[1]*side*w*.22, rot=Math.atan2(d[1],d[0])*180/Math.PI;
    return `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${(L*len).toFixed(1)}" ry="${(w*thick).toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})" ${c}/>`; };
  const limbFront=(A,B)=>{ const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1; return [dy/L,-dx/L]; };
  const td=mDir(f.t), tF=[-td[1],td[0]];
  const leg=(far)=>{ const k=far?J.knee2:J.knee, a=far?J.ankle2:J.ankle, t=far?J.toe2:J.toe, c=far?'#a9b0ba':'#c7ccd4';
    const nT=limbFront(J.hip,k), nS=limbFront(k,a);

    return line(J.sho,e,10.5,c)+line(e,h,8.5,c)+`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="4.6" fill="${c}"/>`
      +belly(J.sho,e,10.5,nU,1,.52,'biceps',far)+belly(J.sho,e,10.5,nU,-1,.52,'triceps',far)+belly(e,h,8.5,nU,0,.4,'forearms',far,.3,.36); };
  const delts=()=>{ let s=''; for(const [m,o] of [['frontDelts',3],['sideDelts',0],['rearDelts',-3]]){ const c=col(m); if(c) s+=`<circle cx="${(J.sho[0]+tF[0]*o).toFixed(1)}" cy="${(J.sho[1]+tF[1]*o).toFixed(1)}" r="7.5" ${c}/>`; } return s; };

    else hp.push(p);
  }
  for(const p of hp){
    const h=J.hand, h2=J.hand2;
    if(p.k==='barbell'){ front+=`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="${p.r||13}" fill="#3a3f47"/><circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="3" fill="#9aa0a8"/>`; }
    else if(p.k==='dumbbell'){ back=`<circle cx="${h2[0].toFixed(1)}" cy="${h2[1].toFixed(1)}" r="6.5" fill="#7b818a"/>`+back; front+=`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="6.5" fill="#3a3f47"/>`; }
    else if(p.k==='kettlebell'){ front+=`<circle cx="${h[0].toFixed(1)}" cy="${(h[1]+8).toFixed(1)}" r="8" fill="#3a3f47"/><circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="4" fill="none" stroke="#3a3f47" stroke-width="2.4"/>`; }
    else if(p.k==='cable'){ back+=line(h,[p.x,p.y],1.6,'#9aa0a8')+`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#8e949c"/>`; }
    else if(p.k==='handle'){ front+=line([h[0]-6,h[1]],[h[0]+6,h[1]],3.5,'#3a3f47'); }
    else if(p.k==='ball'){ front+=`<circle cx="${h[0].toFixed(1)}" cy="${(h[1]-(p.r||10)+3).toFixed(1)}" r="${p.r||10}" fill="#8a6d55"/>`; }
    else if(p.k==='pole'){ front+=line(h,[h[0]+14,240],2.2,'#3a3f47'); back=line(h2,[h2[0]+14,240],2.2,'#7b818a')+back; }
    else if(p.k==='rope'){ const c=mAdd(J.hip,td,20); front+=`<ellipse cx="${c[0].toFixed(1)}" cy="${(c[1]+6).toFixed(1)}" rx="30" ry="${(J.hip[1]+80-c[1]).toFixed(1)}" fill="none" stroke="#3a3f47" stroke-width="1.4" stroke-dasharray="3 3"/>`; }
    else if(p.k==='footplate'){ const a=J.ankle, ld=[a[0]-J.hip[0],a[1]-J.hip[1]], L=Math.hypot(...ld), n=[-ld[1]/L,ld[0]/L], c=mAdd(a,[ld[0]/L,ld[1]/L],7);
      front+=line(mAdd(c,n,18),mAdd(c,n,-18),6,'#8e949c'); }
  }
  const tc='#c7ccd4';
  const torso = line(J.hip,J.sho,24,tc)+line(J.sho,J.neck,9,tc)+`<circle cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="10.5" fill="${tc}"/>`
    + belly(J.hip,J.sho,24,tF,1,.73,'chest',false,.2,.3) + belly(J.hip,J.sho,24,tF,1,.36,'abs',false,.26,.28) + belly(J.hip,J.sho,24,tF,1,.36,'obliques',false,.22,.24)
    + belly(J.hip,J.sho,24,tF,-1,.93,'traps',false,.13,.3) + belly(J.hip,J.sho,24,tF,-1,.72,'upperBack',false,.17,.3) + belly(J.hip,J.sho,24,tF,-1,.5,'lats',false,.22,.3)

  return `<line x1="4" y1="240.5" x2="196" y2="240.5" stroke="#e3e5e9" stroke-width="1.5"/>${back}${leg(true)}${arm(true)}${torso}${leg(false)}${glutes}${arm(false)}${delts()}${front}`;
}

  short: d => new Date(d).toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'}),
  month: d => new Date(d).toLocaleDateString(LOC(),{month:'long',year:'numeric'}),
  count: n => n<10 ? n.toFixed(1) : Fmt.grouped(Math.round(n),0),
  set(s,t){ const p=[]; if(t.weight&&s.weight!=null) p.push(t.reps&&s.reps!=null?`${Fmt.num(s.weight)} kg × ${s.reps}`:`${Fmt.num(s.weight)} kg`); else if(t.reps&&s.reps!=null) p.push(`${s.reps} reps`);
    if(t.duration&&s.seconds!=null) p.push(Fmt.clock(s.seconds)); if(t.distance&&s.km!=null) p.push(`${Fmt.num(s.km)} km`); return p.length?p.join(' · '):'—'; },
  parseDur(text,minutes){ const t=text.trim().replace(',','.'); if(!t) return null; if(!t.includes(':')){const v=parseFloat(t); return isNaN(v)?null:(minutes?v*60:v);} return t.split(':').reduce((a,b)=>a*60+(parseFloat(b)||0),0); }
};

// ---------- metrics ----------
function metricsOf(entry){
  const m={heaviest:0,best1RM:0,bestSetVolume:0,volume:0,maxReps:0,totalReps:0,distance:0,longestDistance:0,duration:0,longestDuration:0,bestPace:null};
  for(const s of entry.sets){ const w=s.weight||0,r=s.reps||0; m.heaviest=Math.max(m.heaviest,w);
    if(w>0&&r>0){ m.best1RM=Math.max(m.best1RM,r<=1?w:w*(1+r/30)); m.bestSetVolume=Math.max(m.bestSetVolume,w*r); m.volume+=w*r; }
    m.maxReps=Math.max(m.maxReps,r); m.totalReps+=r;
    if(s.km>0){m.distance+=s.km; m.longestDistance=Math.max(m.longestDistance,s.km);}
    if(s.seconds>0){m.duration+=s.seconds; m.longestDuration=Math.max(m.longestDuration,s.seconds);}
    if(s.km>0&&s.seconds>0){const p=s.seconds/s.km; m.bestPace=m.bestPace==null?p:Math.min(m.bestPace,p);} }
  return m;
}
const METRICS = {
  heaviest:{label:'Heaviest Weight',icon:'⚖️',f:Fmt.kg}, best1RM:{label:'Best 1RM',icon:'🏆',f:Fmt.kg},
  bestSetVolume:{label:'Best Set Volume',icon:'📦',f:Fmt.kg}, volume:{label:'Best Session Volume',chart:'Session Volume',icon:'📊',f:Fmt.kg},
  maxReps:{label:'Most Reps',icon:'🔁',f:v=>`${v} reps`}, totalReps:{label:'Total Reps',icon:'🔁',f:v=>`${v} reps`},
  longestDistance:{label:'Longest Distance',icon:'📍',f:Fmt.km}, distance:{label:'Total Distance',icon:'📍',f:Fmt.km},
  longestDuration:{label:'Longest Time',icon:'⏱️',f:Fmt.clock}, duration:{label:'Total Time',icon:'⏱️',f:Fmt.clock},
  bestPace:{label:'Best Pace',icon:'🐇',f:v=>Fmt.clock(v)+' /km',lower:true},
  bodyweight:{label:'Body weight',icon:'⚖️',f:v=>Fmt.num(Math.round(v*10)/10)+' kg',neutral:true}
};
const mval = (key,m) => { const v=m[key]; return v>0?v:null; };
function available(t){ const r=[]; if(t.weight&&t.reps) r.push('best1RM','heaviest','bestSetVolume','volume'); else if(t.weight) r.push('heaviest');
  if(t.reps) r.push('maxReps','totalReps'); if(t.distance) r.push('longestDistance','distance'); if(t.duration) r.push('longestDuration','duration'); if(t.distance&&t.duration) r.push('bestPace'); return r; }
const recordKeys = t => available(t).filter(k=>!['totalReps','distance','duration'].includes(k));
const better = (k,a,b) => METRICS[k].lower ? a<b : a>b;

let S;
const ex = id => S.exercises.find(e=>e.id===id);
function history(exId){ const out=[]; for(const s of S.sessions) for(const e of s.entries) if(e.exId===exId) out.push({s,e}); return out; }
function prevEntry(exId,before=Infinity){ for(const s of S.sessions) if(s.start<before){ const e=s.entries.find(e=>e.exId===exId); if(e) return e; } return null; }
function bests(exId,before=Infinity){ const out={}; for(const {s,e} of history(exId)){ if(s.start>=before) continue; const m=metricsOf(e);
  for(const k in METRICS){ const v=mval(k,m); if(v==null) continue; if(!out[k]||better(k,v,out[k].v)) out[k]={v,date:s.start}; } } return out; }
function sessionPRs(sess){ const items=[]; for(const e of sess.entries){ const x=ex(e.exId); const t=x?x.tracking:trackOf('WRTD'); const prior=bests(e.exId,sess.start); const m=metricsOf(e);
  for(const k of recordKeys(t)){ const v=mval(k,m); if(v==null) continue; const p=prior[k]?.v; if(p==null||better(k,v,p)) items.push({name:e.name,k,v,prev:p??null}); } } return items; }
function totals(list){ const t={volume:0,distance:0,duration:0,sets:0}; for(const s of list) for(const e of s.entries){ const m=metricsOf(e); t.volume+=m.volume; t.distance+=m.distance; t.duration+=m.duration; t.sets+=e.sets.length; } return t; }
const sameMonth = (a,b) => { a=new Date(a); b=new Date(b); return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth(); };
const monthSessions = d => S.sessions.filter(s=>sameMonth(s.start,d));

const VIDS={}, PICS={};
const MEDIA={ db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('liftlog-media',1); r.onupgradeneeded=()=>r.result.createObjectStore('m');
    r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>res(); }catch(e){ res(); } }); },
  tx(mode){ return this.db.transaction('m',mode).objectStore('m'); },
  put(k,v){ if(this.db) try{ this.tx('readwrite').put(v,k); }catch(e){} },
  del(k){ if(this.db) try{ this.tx('readwrite').delete(k); }catch(e){} },
  all(){ return new Promise(res=>{ if(!this.db) return res([]); const out=[]; const c=this.tx('readonly').openCursor();
    c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push([cur.key,cur.value]); cur.continue(); } else res(out); }; c.onerror=()=>res(out); }); } };
async function loadMedia(){ await MEDIA.open(); for(const [k,v] of await MEDIA.all()){ const [kind,id]=k.split(':'); const url=URL.createObjectURL(v); if(kind==='v') VIDS[id]=url; else PICS[id]=url; } render(); }

function chart(pts,k){
  if(!pts.length) return `<div style="height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center" class="sec"><div style="font-size:34px">📈</div><div class="hd" style="color:#000">No data in this range</div><div class="cap">Log this exercise to see your progress.</div></div>`;
  const W=330,H=190,P={l:44,r:8,t:10,b:22}; const vs=pts.map(p=>p.v); let lo=Math.min(...vs),hi=Math.max(...vs); if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*.12; lo-=pad; hi+=pad;
  const d0=pts[0].d, d1=pts[pts.length-1].d||d0+1; const X=d=>P.l+(pts.length===1?(W-P.l-P.r)/2:(d-d0)/(d1-d0)*(W-P.l-P.r)); const Y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3); const lab=v=>['longestDuration','duration','bestPace'].includes(k)?Fmt.clock(v):Fmt.grouped(v,['longestDistance','distance'].includes(k)?1:0);
  const last=pts[pts.length-1].v, diff=last-pts[0].v, good=METRICS[k].neutral?null:METRICS[k].lower?diff<0:diff>0;
  return `<div class="row" style="align-items:baseline;gap:8px"><div style="font-size:24px;font-weight:700">${METRICS[k].f(Math.round(last*10)/10)}</div>${pts.length>1?`<div class="sub" style="font-weight:600;color:${diff===0||good===null?'var(--sec)':good?'var(--green)':'var(--red)'}">${diff>=0?'+':'−'}${METRICS[k].f(Math.round(Math.abs(diff)*10)/10)}</div>`:''}</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px">${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e0e0e4" stroke-width=".5"/><text x="${P.l-6}" y="${Y(t)+4}" fill="#8e8e93" font-size="10" text-anchor="end">${lab(t)}</text>`).join('')}
  <text x="${P.l}" y="${H-4}" fill="#8e8e93" font-size="10">${new Date(d0).toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</text><text x="${W-P.r}" y="${H-4}" fill="#8e8e93" font-size="10" text-anchor="end">${new Date(d1).toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</text>
  <path d="${path}" fill="none" stroke="#ff6b29" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="3.2" fill="#ff6b29"/>`).join('')}</svg>`;
}

function miniWeightChart(list){ const pts=[...list].reverse(); if(pts.length<2) return ''; const W=330,H=90; const vs=pts.map(p=>p.kg); let lo=Math.min(...vs)-.3, hi=Math.max(...vs)+.3; const d0=pts[0].date, d1=pts[pts.length-1].date;

function monthOverview(d,hl){
  const ss=monthSessions(d), t=totals(ss); const first=new Date(d); first.setDate(1); first.setHours(0,0,0,0);
  const days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(); const off=(first.getDay()+6)%7; const active=new Set(ss.map(s=>new Date(s.start).getDate()));
  const today=sameMonth(Date.now(),d)?new Date().getDate():-1;
  return `<div class="card"><div class="t3">${Fmt.month(d)}</div>

function logCard(e,ei){

  return `<div class="card"><div class="row" style="gap:10px"><div class="hd" style="color:var(--brand);flex:1;cursor:pointer" onclick="openSheet('exercise',{id:'${e.exId}'})">${esc(e.name)}</div>

      ${t.reps?`<input class="num" inputmode="numeric" placeholder="${p?.reps??'reps'}" value="${s.reps??''}" oninput="setNum(${path},'reps',this.value,true)">`:''}
      ${t.duration?`<input class="num" inputmode="text" placeholder="${ph(p?.seconds,Fmt.clock,minutes?'min':'sec')}" value="${s.seconds!=null?Fmt.clock(s.seconds):''}" oninput="${path}.seconds=Fmt.parseDur(this.value,${minutes});save()">`:''}
      ${t.distance?`<input class="num" inputmode="decimal" placeholder="${p?.km!=null?Fmt.num(p.km):'km'}" value="${s.km??''}" oninput="setNum(${path},'km',this.value)">`:''}

      <div class="restrow ${s.rest?'':'off'}" onclick="openSheet('restPicker',{ei:${ei},si:${si},val:${s.rest||90}})"><span></span>⏱ ${s.rest?'Rest '+restLabel(s.rest):'Add rest'}<span></span></div>`; }).join('')}
    <div class="row" style="gap:8px;margin-top:8px"><button class="btn tonal small" onclick="addSet(${ei})">＋ Add Set</button>${e.sets.length>1?`<button class="btn red small" style="width:50px" onclick="S.active.entries[${ei}].sets.pop();save();render()">−</button>`:''}</div></div>`;
}
function setNum(obj,key,val,int){ const v=parseFloat(String(val).replace(',','.')); obj[key]=isNaN(v)?null:(int?Math.round(v):v); save(); }
function addSet(ei){ const e=S.active.entries[ei]; const last=e.sets[e.sets.length-1]; e.sets.push({id:uid(),weight:last?.weight??null,rest:last?.rest??null,done:false}); save(); render(); }
function toggleDone(ei,si){ const e=S.active.entries[ei], s=e.sets[si]; const p=prevEntry(e.exId,S.active.start)?.sets[si]; const t=ex(e.exId)?.tracking||trackOf('WR');

  const has=s.weight!=null||s.reps!=null||s.seconds!=null||s.km!=null; if(!s.done&&!has){toast('Enter a value first');return;} s.done=!s.done; if(s.done&&s.rest>0) startRest(s.rest,e.name); save(); render(); }

function restLabel(sec){ const m=Math.floor(sec/60), r=sec%60; return m?(r?`${m} min ${r} s`:`${m} min`):`${r} s`; }
function startRest(sec,label){ UI.rest={end:Date.now()+sec*1000,total:sec,label}; }
function adjustRest(d){ if(!UI.rest) return; UI.rest.end+=d*1000; UI.rest.total=Math.max(UI.rest.total+d,(UI.rest.end-Date.now())/1000); if(UI.rest.end<=Date.now()) UI.rest=null; render(); }
function restBar(){ const r=UI.rest; if(!r) return ''; const left=Math.max(0,(r.end-Date.now())/1000);

// ---------- drag to reorder (any distance, one move) ----------
let DRAG=null;
function dragStart(ev,kind){
  ev.preventDefault(); const row=ev.target.closest('.drag-row'); const rows=[...row.parentElement.querySelectorAll(':scope > .drag-row')];
  DRAG={kind,row,rows,rects:rows.map(r=>r.getBoundingClientRect()),from:rows.indexOf(row),to:rows.indexOf(row),y0:ev.clientY};
  row.classList.add('dragging'); document.addEventListener('pointermove',dragMove); document.addEventListener('pointerup',dragEnd,{once:true}); document.addEventListener('pointercancel',dragEnd,{once:true});
}
function dragMove(ev){ if(!DRAG) return; const {rows,rects,from,row}=DRAG; const dy=ev.clientY-DRAG.y0; row.style.transform=`translateY(${dy}px)`;
  const mid=rects[from].top+rects[from].height/2+dy; let to=0; rects.forEach((r,i)=>{ if(i!==from&&r.top+r.height/2<mid) to++; }); DRAG.to=to;
  const h=rects[from].height; rows.forEach((r,i)=>{ if(i===from) return; let shift=0; if(from<to&&i>from&&i<=to) shift=-h; if(from>to&&i>=to&&i<from) shift=h; r.style.transform=shift?`translateY(${shift}px)`:''; }); }
function dragEnd(){ document.removeEventListener('pointermove',dragMove); if(!DRAG) return; const {kind,from,to}=DRAG; DRAG=null;
  const arr = kind==='routine' ? topSheet().draft.ids : S.active.entries; if(from!==to){ const [m]=arr.splice(from,1); arr.splice(to,0,m); if(kind==='workout') save(); } render(); }

const TABS=[['workout','Workout','routines','<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>'],
  ['exercises','Exercises','library','<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>'],
  ['profile','Profile','profile','<circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="10" r="3.4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M5.8 18.6c1.5-2.4 3.7-3.6 6.2-3.6s4.7 1.2 6.2 3.6" stroke="currentColor" stroke-width="2" fill="none"/>']];
function cur(){ if(UI.sheets.length) return topSheet(); const st=UI.stacks[UI.tab]; return st[st.length-1]||(UI.tab==='exercises'?libState():{}); }
function screenHTML(st){ return Screens[st.screen](st); }
function render(resetScroll){
  const app=$('#app'); const scrolls=[...app.querySelectorAll('.content')].map(c=>c.scrollTop);
  const tabRoot={workout:'routines',exercises:'library',profile:'profile'}[UI.tab];
  const stack=UI.stacks[UI.tab]; const st=stack.length?stack[stack.length-1]:(UI.tab==='exercises'?libState():{screen:tabRoot});
  const base = (UI.tab==='exercises' && stack.length<=1) ? Screens.library(libState()) : screenHTML(st.screen?st:{screen:tabRoot});
  let html=`<div class="screen">${base}</div><div class="tabbar">${TABS.map(([k,l,,svg])=>`<button class="tab ${UI.tab===k?'on':''}" onclick="switchTab('${k}')"><svg viewBox="0 0 24 24">${svg}</svg>${l}</button>`).join('')}</div>`;
  if(UI.cover && (S.active||UI.summary)) html+=`<div class="cover"><div class="screen">${UI.summary?Screens.summary({id:UI.summary,done:true}):Screens.workout()}</div>${UI.summary?'':restBar()}</div>`;
  UI.sheets.forEach((sh,i)=>{ sh._i=i; const small=sh.screen==='restPicker'||sh.screen==='addWeight'; html+=`<div class="sheet"><div class="panel ${small?'small':''}"><div class="screen" style="${small?'position:relative;height:auto':''}">${screenHTML(sh)}</div></div></div>`; });
  if(UI.dialog){ html+=`<div class="dialog" onclick="if(event.target===this){UI.dialog=null;render()}"><div class="box"><div class="grp"><div class="msg">${esc(UI.dialog.msg)}</div>${UI.dialog.actions.map(([l,,d],i)=>`<div class="${d?'destr':''}" onclick="runDialog(${i})">${esc(l)}</div>`).join('')}</div><div class="grp"><div class="cancel" onclick="UI.dialog=null;render()">Cancel</div></div></div></div>`; }
  app.innerHTML=html; if(isDE()) translateDOM(app);
  if(!resetScroll) [...app.querySelectorAll('.content')].forEach((c,i)=>{ if(scrolls[i]!=null) c.scrollTop=scrolls[i]; });
  const wh=document.getElementById('wheel'); if(wh){ const on=wh.querySelector('.on'); if(on) wh.scrollTop=on.offsetTop-wh.clientHeight/2+on.clientHeight/2; }
  document.querySelectorAll('textarea.note').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px';});
}
function runDialog(i){ const a=UI.dialog.actions[i][1]; UI.dialog=null; a(); if(UI.dialog==null) render(); }
function switchTab(k){ if(UI.tab===k){ UI.stacks[k]=k==='exercises'?[libState()]:[]; } UI.tab=k; render(true); }
// library uses stacks.exercises[0] as its root state; pushes go after it
push=function(screen,p={}){ if(UI.sheets.length){ openSheet(screen,p); return; } if(UI.tab==='exercises') libState(); UI.stacks[UI.tab].push({screen,...p}); render(true); };
pop=function(){ if(UI.sheets.length){ closeSheet(); return; } const st=UI.stacks[UI.tab]; if(UI.tab==='exercises'&&st.length<=1) return; st.pop(); render(true); };
setInterval(()=>{ if(UI.rest){ const left=(UI.rest.end-Date.now())/1000; if(left<=0){ UI.rest=null; beep(); toast('Rest over — next set!'); render(); } else { const t=document.getElementById('restT'), b=document.getElementById('restP'); if(t) t.textContent=Fmt.clock(Math.ceil(left)); if(b) b.style.width=Math.min(100,left/UI.rest.total*100)+'%'; } } },250);
setInterval(()=>{ const el=document.getElementById('timer'); if(el&&S.active) el.textContent=Fmt.clock((Date.now()-S.active.start)/1000);
  const c=document.getElementById('clock'); const d=new Date(); c.textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); },1000);
document.addEventListener('input',e=>{ if(e.target.matches('textarea.note')){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';} });
load(); render(); loadMedia();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
</script>
